name: Build Windows Application (Both Editions)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Windows ${{ matrix.edition }} Edition
    runs-on: windows-latest
    strategy:
      matrix:
        edition: [cutting, standard]

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run automated test suite for ${{ matrix.edition }}
        run: npm run test:${{ matrix.edition }}

      - name: Build web application assets for ${{ matrix.edition }}
        run: npm run build:${{ matrix.edition }}

      - name: Build Windows desktop executables for ${{ matrix.edition }}
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npm run electron:build:${{ matrix.edition }}

      - name: Upload build artifacts (${{ matrix.edition }})
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.edition }}-binaries
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          generate_release_notes: true
          draft: false
          prerelease: false
